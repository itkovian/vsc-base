[project]
name = "vsc-base"
version = "4.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andy Georges", email = "itkovian@gmail.com" }
]
requires-python = "==3.9.*"
dependencies = [
  "vsc-install >= 0.17.19"
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsc"]
only-include = ["src/vsc/utils"]

[project.scripts]

[tool.uv.sources]
vsc-install = { git = "https://github.com/itkovian/vsc-install.git", branch = "uv-package-only"}

[dependency-groups]
dev = [
  "tox",
  "tox-uv",
  "pytest>=7.0",
  "pytest-cov",
  "prospector",
  "tenacity",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["*.py"]
norecursedirs = ["test/runtests"]
python_classes = ["Test*"]
python_functions = ["test_*"]
